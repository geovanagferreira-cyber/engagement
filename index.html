<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engagement — Da teoria à prática. Do estudante ao engenheiro.</title>
<meta name="theme-color" content="#142B45">
<style>
:root{
  --navy:#142B45; --navy2:#1d4568; --blue:#7655D9; --blue2:#ece7fb; --orange:#F28C38;
  --bg:#f3f4fa; --card:#ffffff; --text:#202631; --muted:#5b6b8c; --line:#e1e7f3;
  --ok:#17a673; --warn:#e8a317; --bad:#e0475b; --radius:16px;
  --shadow:0 6px 24px rgba(20,43,69,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{line-height:1.2;color:var(--navy)}
svg{display:block}

/* ===== Layout ===== */
.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:linear-gradient(180deg,var(--navy),#0f2036);color:#fff;padding:22px 16px;display:none;flex-direction:column;gap:6px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;cursor:pointer}
.brand b{font-size:1.35rem;letter-spacing:.3px;color:#fff}
.brand small{display:block;font-size:.66rem;opacity:.7;line-height:1.25;margin-top:2px;font-weight:400}
.navbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#c9d6f5;font-weight:600;font-size:.95rem;text-align:left;width:100%;transition:.15s}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtn.active{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(118,85,217,.45)}
.navbtn svg{width:20px;height:20px;flex:none}
.sidefoot{margin-top:auto;font-size:.72rem;color:#8fa3d1;padding:10px 8px;border-top:1px solid rgba(255,255,255,.1)}
.tag-proto{display:inline-block;background:var(--orange);color:#1b1100;font-weight:700;font-size:.62rem;padding:2px 8px;border-radius:99px;margin-bottom:6px}

.topbar{position:sticky;top:0;z-index:15;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.topbar .brand{padding:0}
.topbar .brand b{font-size:1.15rem}
.topbar .brand small{display:none}

.bottomnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 18px rgba(20,43,69,.08)}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:.62rem;color:var(--muted);font-weight:600}
.bottomnav button svg{width:22px;height:22px}
.bottomnav button.active{color:var(--blue)}
.bottomnav button.active svg{color:var(--orange)}

main{padding:18px 16px 96px;max-width:1100px;margin:0 auto}
@media(min-width:900px){
  .sidebar{display:flex}
  .topbar,.bottomnav{display:none}
  main{margin-left:250px;padding:34px 40px 60px;max-width:none}
  #app{max-width:1100px;margin:0 auto}
}

/* ===== Componentes ===== */
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pagehead{margin-bottom:20px}
.pagehead h2{font-size:1.6rem}
.pagehead p{color:var(--muted);margin-top:4px}
.backbtn{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:700;margin-bottom:12px;padding:6px 12px 6px 6px;border-radius:99px}
.backbtn:hover{background:var(--blue2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h3{font-size:1.1rem;margin-bottom:6px}
.card p{color:var(--muted);font-size:.93rem}
.sec{margin:30px 0 14px;display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.sec h3{font-size:1.2rem}
.sec a{color:var(--blue);font-weight:700;font-size:.9rem;cursor:pointer}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:.93rem;transition:.15s}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(118,85,217,.3)}
.btn.primary:hover{background:#6845cf;transform:translateY(-1px)}
.btn.orange{background:var(--orange);color:#1b1100}
.btn.orange:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.ghost{background:var(--blue2);color:var(--blue)}
.btn.ghost:hover{background:#ddd3f8}
.btn.line{border:2px solid var(--line);color:var(--navy)}
.btn.line:hover{border-color:var(--blue)}
.btn.sm{padding:8px 14px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.chip{display:inline-block;padding:4px 11px;border-radius:99px;background:var(--blue2);color:var(--blue);font-size:.76rem;font-weight:700}
.chip.o{background:#fff1e1;color:#b45a00}
.chip.g{background:#e2f6ee;color:#0f7a54}
.bar{height:9px;background:#e6ecf8;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#a28af0);border-radius:99px;transition:width .6s ease}
.bar.o i{background:linear-gradient(90deg,var(--orange),#ffb066)}
.bar.g i{background:linear-gradient(90deg,var(--ok),#4fd1a1)}
.bar.r i{background:linear-gradient(90deg,var(--bad),#f08a98)}
.barlabel{display:flex;justify-content:space-between;font-size:.82rem;font-weight:600;margin-bottom:5px}

.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,var(--blue) 140%);color:#fff;border-radius:22px;padding:28px;position:relative;overflow:hidden}
.hero h2{color:#fff;font-size:1.7rem}
.hero p{color:#d5dbe8;margin-top:8px;max-width:560px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(242,140,56,.45),transparent 70%)}
.hero .btn{margin-top:16px;position:relative;z-index:1}
.hero .eyebrow{font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;color:#ffb066;font-weight:700;margin-bottom:6px}

.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p)*1%),#e3e9f5 0);display:grid;place-items:center;flex:none}
.ring span{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;color:var(--navy);font-size:1.15rem}
.stat{text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--navy)}
.stat span{font-size:.8rem;color:var(--muted)}

.course .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:1.4rem;margin-bottom:12px;background:var(--blue2)}
.course .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin:12px 0 6px;font-weight:600}
.course .btn{margin-top:14px;width:100%}

.lesson-body h4{margin:18px 0 8px;font-size:1.05rem}
.lesson-body ul{margin:6px 0 6px 20px;color:#34456a}
.lesson-body li{margin-bottom:5px}
.formula{background:var(--navy);color:#fff;font-family:Consolas,monospace;padding:12px 16px;border-radius:12px;margin:10px 0;font-size:.95rem;overflow-x:auto}
.callout{background:#fff7ec;border-left:4px solid var(--orange);padding:12px 16px;border-radius:0 12px 12px 0;margin:14px 0;color:#5a3500;font-size:.92rem}
.q{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:#fbfcff}
.q p{font-weight:700;color:var(--navy);margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;padding:10px 14px;border:2px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff;font-size:.92rem;transition:.15s}
.opt:hover:not([disabled]){border-color:var(--blue);background:var(--blue2)}
.opt.right{border-color:var(--ok);background:#e6f8f0}
.opt.wrong{border-color:var(--bad);background:#fdecef}
.fb{font-size:.88rem;margin-top:6px;padding:10px 12px;border-radius:10px;background:#eef3fd;color:#26385f}

.mentor .av{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:1.2rem;margin-bottom:12px;background:linear-gradient(135deg,var(--blue),var(--navy))}
.mentor .area{color:var(--blue);font-weight:700;font-size:.85rem}
.mentor .btn{margin-top:14px;width:100%}

/* ===== Simulador ===== */
.sim-hero{background:linear-gradient(135deg,#0f2036,#1d4568);color:#fff;border-radius:20px;padding:24px;position:relative;overflow:hidden}
.sim-hero h2{color:#fff}
.sim-hero p{color:#cfdcf9;margin-top:8px}
.sim-hero .alert{display:inline-flex;gap:8px;align-items:center;background:rgba(242,140,56,.18);color:#ffc58a;border:1px solid rgba(242,140,56,.5);padding:5px 12px;border-radius:99px;font-size:.8rem;font-weight:700;margin-bottom:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.fact{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:1.25rem;color:#fff}
.fact span{font-size:.75rem;color:#b9c9ee}
.char{cursor:pointer;text-align:left;transition:.18s;border:2px solid var(--line);position:relative}
.char:hover{border-color:var(--blue);transform:translateY(-2px)}
.char.sel{border-color:var(--blue);background:#f5f9ff}
.char.heard::after{content:"✔ ouvido";position:absolute;top:12px;right:12px;font-size:.68rem;background:#e2f6ee;color:#0f7a54;font-weight:700;padding:2px 8px;border-radius:99px}
.char .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;margin-bottom:10px}
.char h4{font-size:1rem}
.char small{color:var(--muted);font-weight:600}
.dialog{margin-top:16px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.dialog .says{padding:20px 22px;font-size:1.02rem;background:var(--blue2);color:#14306a;position:relative}
.dialog .says::before{content:"“";font-size:3rem;color:var(--blue);opacity:.35;position:absolute;left:8px;top:-4px}
.dialog .says p{padding-left:16px}
.dialog .under{padding:16px 22px;font-size:.92rem;color:#34456a}
.dialog .under b{color:var(--orange)}
.step{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#1b1100;font-weight:800;display:grid;place-items:center;flex:none}
.step h3{font-size:1.15rem}
.alt{cursor:pointer;border:2px solid var(--line);transition:.18s;display:flex;flex-direction:column;gap:8px}
.alt:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 10px 28px rgba(118,85,217,.15)}
.alt .letter{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center}
.alt ul{margin-left:18px;color:#34456a;font-size:.88rem}
.hint{background:#fff7ec;border:1px dashed var(--orange);color:#7a4300;border-radius:12px;padding:10px 14px;font-size:.88rem;margin-top:12px}
.score-card{display:flex;gap:16px;align-items:center}
.score-card .ring{width:84px;height:84px}
.score-card .ring span{width:64px;height:64px;font-size:1rem}
.lvl{font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:99px}
.lvl.a{background:#e2f6ee;color:#0f7a54}.lvl.b{background:#ece7fb;color:#5a3fc0}.lvl.c{background:#fff1d6;color:#8a5a00}.lvl.d{background:#fdecef;color:#b02a3f}
.fbk{border-left:4px solid var(--blue);padding-left:14px;margin-top:10px;font-size:.9rem}
.fbk p{margin:6px 0;color:#34456a}
.fbk .pos::before{content:"✔ ";color:var(--ok);font-weight:800}
.fbk .imp::before{content:"➜ ";color:var(--orange);font-weight:800}

/* ===== Modal / toast ===== */
.overlay{position:fixed;inset:0;background:rgba(7,16,42,.6);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.overlay.open{display:flex}
.modal{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:24px;animation:up .28s ease;position:relative}
@media(min-width:700px){.overlay{align-items:center;padding:20px}.modal{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:1.1rem;color:var(--navy);font-weight:700}
.modal h3{font-size:1.35rem;margin-bottom:4px;padding-right:36px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:.92rem}
.check.on{border-color:var(--ok);background:#e9f9f2}
.check .bx{width:20px;height:20px;border-radius:6px;border:2px solid #b7c3de;flex:none;display:grid;place-items:center;font-size:.8rem;color:#fff;margin-top:1px}
.check.on .bx{background:var(--ok);border-color:var(--ok)}
.field{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.field label{font-size:.8rem;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.field input{padding:9px 12px;border:2px solid var(--line);border-radius:10px;font:inherit;width:140px}
.field input:focus{outline:none;border-color:var(--blue)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){.toast{bottom:36px}}

.cert{background:linear-gradient(135deg,#fff,#f1f6ff);border:2px solid var(--blue2);position:relative}
.cert::before{content:"🎓";position:absolute;right:16px;top:12px;font-size:1.6rem}
.cert.locked{opacity:.55;filter:grayscale(.7)}
.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:.78rem}

/* ===== v2: plataforma de prevenção à evasão ===== */
.btn svg{width:20px;height:20px;flex:none}
.hero .row .btn{margin-top:0}
.sidebar{overflow-y:auto}
.sidebar .navbtn{padding:10px 14px}
.navlabel{font-size:.66rem;letter-spacing:1.3px;text-transform:uppercase;color:#7f94c4;padding:6px 14px 4px;font-weight:700}
.navbtn.envgo{margin-top:auto;border:1.5px solid var(--orange);color:#ffc58a}
.navbtn.envgo:hover{background:rgba(242,140,56,.15);color:#fff}
.envgo + .sidefoot{margin-top:10px}
.envbtn{background:var(--orange);color:#1b1100;font-weight:800;font-size:.72rem;padding:7px 13px;border-radius:99px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{padding:8px 14px;border-radius:99px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:.82rem;color:var(--navy);transition:.15s}
.tab:hover{border-color:var(--blue)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.search{padding:10px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;width:100%;max-width:340px;margin-bottom:14px}
.search:focus{outline:none;border-color:var(--blue)}

.stepper{display:flex;justify-content:space-between;gap:6px;margin:6px 0 20px}
.stp{flex:1;text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);position:relative}
.stp i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:0 auto 4px;background:#e3e9f5;color:var(--navy);position:relative;z-index:1;font-size:.9rem}
.stp::before{content:"";position:absolute;top:16px;left:-50%;width:100%;height:3px;background:#e3e9f5}
.stp:first-child::before{display:none}
.stp.done i{background:var(--ok);color:#fff}
.stp.done::before,.stp.cur::before{background:var(--ok)}
.stp.cur i{background:var(--orange);color:#1b1100;box-shadow:0 0 0 5px rgba(242,140,56,.25)}
.stp.open i{background:var(--blue);color:#fff}
details.ph{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
details.ph summary{list-style:none;padding:16px 18px;cursor:pointer;display:flex;gap:14px;align-items:center}
details.ph summary::-webkit-details-marker{display:none}
details.ph[open] summary{background:var(--blue2)}
.ph .num{width:44px;height:44px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.ph .body{padding:14px 20px 20px}
.ph h4{margin:14px 0 6px;font-size:.95rem}
.ph ul{margin-left:20px;color:#34456a;font-size:.92rem}
.ph li{margin-bottom:4px}

.meter{position:relative;height:14px;background:#e6ecf8;border-radius:99px;margin:14px 0 8px}
.meter .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),#a28af0);transition:width .6s}
.meter .fill.ok{background:linear-gradient(90deg,var(--ok),#4fd1a1)}
.meter .mk{position:absolute;left:80%;top:-5px;bottom:-5px;width:3px;background:var(--orange);border-radius:2px}
.badge{text-align:center;padding:16px}
.badge .em{font-size:2.2rem}
.badge h4{font-size:.92rem;margin-top:4px}
.badge p{font-size:.78rem}
.badge.locked{opacity:.5;filter:grayscale(1)}
.rk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:8px}
.rk .pos{width:32px;height:32px;border-radius:50%;background:var(--blue2);color:var(--blue);font-weight:800;display:grid;place-items:center;flex:none}
.rk.me{border:2px solid var(--orange);background:#fff7ec}
.rk.me .pos{background:var(--orange);color:#1b1100}
.rk .pts{margin-left:auto;font-weight:800;color:var(--navy);white-space:nowrap}

.demo-banner{background:#fff7ec;border:1px dashed var(--orange);color:#7a4300;border-radius:14px;padding:12px 16px;font-size:.88rem;margin-bottom:18px}
.demo-banner b{color:#b45a00}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:700}
.kpi b{display:block;font-size:2rem;color:var(--navy);margin:4px 0;line-height:1.1}
.kpi small{color:var(--muted);font-size:.78rem}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut span{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;color:var(--navy);text-align:center;font-size:1.25rem;line-height:1.1}
.donut small{display:block;font-size:.6rem;color:var(--muted);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.alertc{display:flex;gap:14px;align-items:flex-start;border-left:5px solid var(--bad);flex-wrap:wrap}
.alertc.m{border-left-color:var(--warn)}
.alertc.l{border-left-color:var(--ok)}
.alertc .tx{flex:1;min-width:200px}
.flow{display:grid;gap:10px;grid-template-columns:1fr}
.node{background:#fff;border:2px solid var(--blue2);border-radius:14px;padding:14px;text-align:center;font-size:.9rem}
.node b{display:block;color:var(--navy)}
.arrow{align-self:center;text-align:center;color:#b45a00;font-weight:800;font-size:.78rem}
@media(min-width:900px){.flow{grid-template-columns:1fr auto 1fr auto 1fr}}
input[type=range]{width:100%;accent-color:var(--orange)}
.big{font-size:1.8rem;font-weight:800;color:var(--navy)}
@media(max-width:520px){.stp span{font-size:.62rem}}

/* ===== v3 · identidade visual tecnológica + gamificação ===== */
:root{--bg:#f3f4fa;--shadow:0 10px 30px rgba(20,43,69,.09);--radius:20px}
body{background:radial-gradient(1100px 480px at 85% -10%,rgba(118,85,217,.12),transparent 60%),var(--bg)}
.card{border-radius:20px;transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 14px 34px rgba(20,43,69,.13)}
.btn{border-radius:14px}
.btn.primary{background:linear-gradient(135deg,#7655D9,#9477ec);box-shadow:0 6px 18px rgba(118,85,217,.4)}
.btn.primary:hover{background:linear-gradient(135deg,#6845cf,#8a68e6)}
.btn.orange{background:linear-gradient(135deg,#F28C38,#f8a85f);color:#2b1700;box-shadow:0 6px 18px rgba(242,140,56,.4)}
.navbtn.active{background:linear-gradient(135deg,#7655D9,#8d6fe9);box-shadow:0 6px 16px rgba(118,85,217,.45)}
.bar i,.meter .fill{background:linear-gradient(90deg,#7655D9,#a28af0)}
.bar.o i{background:linear-gradient(90deg,#F28C38,#ffb066)}
.hero{background:linear-gradient(135deg,#142B45 0%,#202631 55%,#7655D9 170%)}
.sim-hero{background:linear-gradient(135deg,#202631,#142B45 70%,#3b2f78)}
.hud{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#142B45,#202631);color:#fff;border-radius:18px;padding:10px 14px;margin-bottom:18px;box-shadow:var(--shadow);cursor:pointer}
@media(min-width:900px){.hud{position:sticky;top:12px;z-index:12}}
.hchip{background:rgba(255,255,255,.1);border-radius:99px;padding:6px 12px;font-weight:800;font-size:.85rem;white-space:nowrap}
.hchip.fire{background:rgba(242,140,56,.22);color:#ffc58a}
.hxp{flex:1;min-width:0}
.hl{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;margin-bottom:5px;flex-wrap:wrap}
.hl span{color:#c9d0e0}
.hbar{height:9px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,#F28C38,#ffc58a);border-radius:99px;transition:width .7s}
.trail .th{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.trail .th .em{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#ece7fb,#fff1e1);display:grid;place-items:center;font-size:1.6rem}
.path{display:flex;flex-direction:column}
.pn{position:relative;display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:16px;cursor:pointer;transition:.2s}
.pn:hover{background:#f4f1fd}
.pn+.pn::before{content:"";position:absolute;left:36px;top:-14px;height:26px;border-left:3px dashed #cfc6ee}
.pn.done+.pn::before{border-left-style:solid;border-color:#7655D9}
.orb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none;background:#e6e1f6;color:#5a4a99;position:relative;z-index:1}
.pn.open .orb{background:linear-gradient(135deg,#F28C38,#f8a85f);color:#2b1700;box-shadow:0 0 0 6px rgba(242,140,56,.2);animation:pulse 2s infinite}
.pn.done .orb{background:linear-gradient(135deg,#7655D9,#9477ec);color:#fff}
.pn.lock{opacity:.6}.pn.lock .orb{background:#e3e5ee;color:#7b8396}
.pi small{display:block;color:var(--muted);font-size:.84rem}
.sdots{display:flex;gap:8px;flex-wrap:wrap}
.sd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ececf4;font-size:.72rem;font-weight:800;color:#8a90a5}
.sd.on{background:linear-gradient(135deg,#F28C38,#f8a85f);color:#2b1700}
.dm .tipo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.dm.fin{border:2px solid #7655D9;background:linear-gradient(135deg,#fff,#f4f1fd)}
.lgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 16px}
.lgb{text-align:center;padding:12px 4px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:.8rem}
.lgb .em{font-size:1.7rem;display:block}
.lgb.cur{border-color:#F28C38;background:#fff7ec}.lgb.sel{box-shadow:0 0 0 3px rgba(118,85,217,.3)}
.zline{text-align:center;font-size:.72rem;color:#0f7a54;font-weight:800;margin:2px 0 10px}
.rk.zone{border-color:#bfe9d4}
.ach{text-align:center;padding:18px 14px}
.ach .md{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:linear-gradient(135deg,#7655D9,#F28C38);box-shadow:0 8px 20px rgba(118,85,217,.35);border:4px solid #fff;outline:3px solid #e6e1f6}
.ach.lk .md{background:#e3e5ee;filter:grayscale(1);box-shadow:none;opacity:.7}
.ach h4{font-size:.95rem}.ach p{font-size:.8rem;margin:4px 0 8px}
.gcmp{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;margin-bottom:10px;font-size:.85rem;font-weight:600}
.xpfly{position:fixed;left:50%;top:38%;transform:translate(-50%,0);z-index:80;font-size:2.4rem;font-weight:900;color:#fff;text-shadow:0 4px 24px rgba(118,85,217,.9),0 2px 0 #7655D9;pointer-events:none;animation:fly 1.6s ease forwards;text-align:center}
.xpfly small{display:block;font-size:.9rem;color:#ffc58a;font-weight:700}
@keyframes fly{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:79;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{top:105%;transform:translateX(40px) rotate(720deg);opacity:.8}}
.achpop{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;background:linear-gradient(135deg,#142B45,#202631);color:#fff;border:2px solid #F28C38;border-radius:16px;padding:12px 18px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:drop 3.2s ease forwards;text-align:center;max-width:92vw}
@keyframes drop{0%{transform:translate(-50%,-90px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-90px);opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(242,140,56,.05)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function resetDemo(){

}
function parentOf(v){ return ({lesson:'learn',esqtrail:'esq',mission:'missions'})[v] || v; }
function go(v,p,isBack){
  const e = COORD_VIEWS.includes(v) ? 'coord' : 'est';
  if(!isBack && cur && !(cur.v===v && cur.p===p)) stack.push(cur);
  if(!isBack && ALLNAV.some(n=>n[0]===v) && !p) stack = (v==='home'||v==='dash') ? [] : [e==='est'?{v:'home',p:null}:{v:'dash',p:null}];
  if(e!==env){ env=e; buildNav(); }
  cur = {v,p};
  closeModal();
  render();
  window.scrollTo({top:0});
}
function back(){
  const prev = stack.pop() || {v:'home',p:null};
  go(prev.v, prev.p, true);
}
function backBtn(label){ return `<button class="backbtn" onclick="back()">← ${label||'Voltar'}</button>`; }
function render(keepScroll){
  const y = window.scrollY;
  const fn = VIEWS[cur.v] || VIEWS.home;
  $('#app').innerHTML = (env==='est'?hudHTML():'')+`<div class="view">${fn(cur.p)}</div>`+
    `<div class="foot">Engagement · protótipo demonstrativo · todos os dados são fictícios · <a onclick="resetDemo()" style="color:var(--blue);cursor:pointer;font-weight:700">Reiniciar demonstração</a></div>`;
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active', b.dataset.v===parentOf(cur.v)));
  if(keepScroll) window.scrollTo({top:y});
}

      <p style="margin-top:6px">${c.desc}</p>
      <div class="meta"><span>${c.hours} horas</span><span>${S.progress[id]}% concluído</span></div>
      <div class="bar ${S.progress[id]>=100?'g':''}"><i style="width:${S.progress[id]}%"></i></div>
      <button class="btn primary" onclick="go('lesson','${id}')">${S.progress[id]>=100?'Revisar aula':'Acessar curso'}</button>
    </div>`).join('');
  return `<div class="pagehead"><h2>Central de Aprendizagem</h2><p>Cada aula mostra onde a teoria aparece na prática da engenharia.</p></div><div class="grid g2">${cards}</div>`;
};
VIEWS.lesson = id=>{
  const c = COURSES[id]; if(!c) return VIEWS.learn();
  const l = c.lesson;
  const ans = k => S.quiz[id+'-'+k];
  const quiz = l.ex.map((q,i)=>{
    const a = ans(i);
    const opts = q.o.map((o,j)=>{
      let cls='opt'; if(a!==undefined){ if(j===q.c) cls+=' right'; else if(j===a) cls+=' wrong'; }
      return `<button class="${cls}" ${a!==undefined?'disabled':''} onclick="answer('${id}',${i},${j})">${String.fromCharCode(65+j)}) ${o}</button>`;
    }).join('');
    const fb = a!==undefined ? `<div class="fb">${a===q.c?'✔ Correto! ':'✘ Quase lá. '}${q.e}</div>` : '';
    return `<div class="q"><p>${i+1}. ${q.q}</p>${opts}${fb}</div>`;
  }).join('');
  const answered = l.ex.filter((_,i)=>ans(i)!==undefined).length;
  const done = S.lessons[id];
  return `${backBtn('Central de Aprendizagem')}
  <div class="pagehead"><span class="chip">${c.name} · Aula demonstrativa</span><h2 style="margin-top:8px">${l.title}</h2></div>
  <div class="card lesson-body">
    <h4>📘 Conteúdo resumido</h4>
    <ul>${l.resumo.map(r=>`<li>${r}</li>`).join('')}</ul>
    <div class="formula">${l.formula}</div>
    <div class="callout"><b>Na prática:</b> ${l.app}</div>
  </div>
  <div class="sec"><h3>✏️ Exercícios (${answered}/${l.ex.length})</h3></div>
  <div class="card">${quiz}
    <div class="row" style="margin-top:6px">
      <button class="btn orange" ${done?'disabled':''} onclick="finishLesson('${id}')">${done?'✔ Aula concluída':'Concluir aula'}</button>
      <button class="btn line" onclick="go('challenges')">Aplicar em um desafio</button>
    </div>
  </div>`;
};
function answer(id,i,j){
  S.quiz[id+'-'+i]=j; save(); render(true);
  toast(j===COURSES[id].lesson.ex[i].c ? 'Resposta correta! 🎉' : 'Veja a explicação abaixo da questão.');
}
function finishLesson(id){
  if(S.lessons[id]) return;
  S.lessons[id]=true;
  S.progress[id]=Math.min(100,S.progress[id]+20);
  save(); render(true);
  toast('Aula concluída! +20 XP e +20% em '+COURSES[id].name);
}

/* 3. DESAFIOS */
VIEWS.challenges = ()=>{
  const cards = Object.entries(CHALLENGES).map(([id,c])=>{
    const steps = S.ch[id]||[]; const n = steps.filter(Boolean).length;
    const joined = S.joined[id];
    return `<div class="card">
      <div style="font-size:2rem">${c.emoji}</div>
      <h3 style="margin-top:8px">${c.title}</h3>
      <div class="row" style="margin:8px 0"><span class="chip o">${c.level}</span><span class="chip">${c.time}</span><span class="chip o">+${c.passos.length*10+50} XP</span>${joined?`<span class="chip g">${n===c.passos.length?'Concluído':'Em andamento'}</span>`:''}</div>
      <p><b>Objetivo:</b> ${c.objetivo}</p>
      <p style="margin-top:8px"><b>Contexto:</b> ${c.contexto}</p>
      <div style="margin-top:12px"><b style="font-size:.85rem">Conhecimentos utilizados</b><div class="row" style="margin-top:6px;gap:6px">${c.conhecimentos.map(k=>`<span class="chip">${k}</span>`).join('')}</div></div>
      ${joined?`<div class="bar g" style="margin-top:14px"><i style="width:${n/c.passos.length*100}%"></i></div>`:''}
      <div class="row" style="margin-top:14px">
        <button class="btn primary" onclick="${joined?`openChallenge('${id}')`:`join('${id}')`}">${joined?'Continuar desafio':'Participar do desafio'}</button>
        <button class="btn line sm" onclick="openChallenge('${id}')">Ver detalhes</button>
      </div></div>`;
  }).join('');
  return `<div class="pagehead"><h2>Desafios Práticos</h2><p>Problemas reais da engenharia para você resolver com o que aprende em sala.</p></div><div class="grid g3">${cards}</div>`;
};
function join(id){
  S.joined[id]=true; S.ch[id]=S.ch[id]||CHALLENGES[id].passos.map(()=>false); save();
  toast('Você entrou no desafio! 🚀'); openChallenge(id); if(cur.v==='challenges'||cur.v==='home') render(true);
}
function openChallenge(id){
  const c = CHALLENGES[id]; const joined = S.joined[id];
  const steps = S.ch[id]||c.passos.map(()=>false);
  const n = steps.filter(Boolean).length;
  const list = c.passos.map((p,i)=>`<div class="check ${steps[i]?'on':''}" ${joined?`onclick="toggleStep('${id}',${i})"`:''}><div class="bx">${steps[i]?'✓':''}</div><div>${p}</div></div>`).join('');
  const calc = c.calc ? `
    <h4 style="margin:18px 0 6px">🧮 Calculadora de captação</h4>
    <p style="font-size:.88rem;color:var(--muted)">Volume (litros) = chuva (mm) × área (m²) × coeficiente de aproveitamento (≈ 0,8 para telhado)</p>
    <div class="field">
      <div><label>Área do telhado (m²)</label><input id="ca" type="number" value="200" min="0" oninput="calcRain()"></div>
      <div><label>Chuva no mês (mm)</label><input id="cp" type="number" value="120" min="0" oninput="calcRain()"></div>
    </div>
    <div class="callout" id="cr"></div>` : '';
  openModal(`
    <span class="chip o">${c.level} · ${c.time} · até +${c.passos.length*10+50} XP</span>
    <h3 style="margin-top:8px">${c.emoji} ${c.title}</h3>
    <p style="color:var(--muted);margin:8px 0"><b>Objetivo:</b> ${c.objetivo}</p>
    <p style="color:var(--muted)"><b>Contexto:</b> ${c.contexto}</p>
    <div class="row" style="margin:12px 0;gap:6px">${c.conhecimentos.map(k=>`<span class="chip">${k}</span>`).join('')}</div>
    <h4 style="margin:14px 0 8px">Etapas ${joined?`(${n}/${c.passos.length})`:''}</h4>
    ${list}
    ${joined?'':`<p style="font-size:.85rem;color:var(--muted);margin:6px 0 0">Participe para marcar as etapas concluídas.</p>`}
    ${calc}
    <div class="row" style="margin-top:16px">
      ${joined?`<button class="btn primary" onclick="closeModal()">Salvar e fechar</button>`:`<button class="btn primary" onclick="join('${id}')">Participar do desafio</button>`}
      <button class="btn line" onclick="closeModal()">Fechar</button>
    </div>`);
  if(c.calc) calcRain();
}
function calcRain(){
  const a=+$('#ca').value||0, p=+$('#cp').value||0;
  const v=Math.round(a*p*0.8);
  $('#cr').innerHTML=`<b>Volume captado no mês: ${v.toLocaleString('pt-BR')} litros</b> (${(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})} m³). Uma cisterna de ${Math.ceil(v/1000/ 5)*5} m³ já guardaria esse volume.`;
}
function toggleStep(id,i){
  const arr = S.ch[id]||CHALLENGES[id].passos.map(()=>false);
  arr[i]=!arr[i]; S.ch[id]=arr; save();
  const done = arr.every(Boolean);
  openChallenge(id);
  if(done) toast('Desafio concluído! Ele foi adicionado ao seu portfólio. 🏆');
  if(cur.v==='challenges'||cur.v==='home'||cur.v==='portfolio') render(true);
}

/* 4. SIMULADOR PROFISSIONAL */
VIEWS.sim = ()=> sim.choice ? simResult() : simPlay();

function simPlay(){
  const heardN = Object.keys(sim.heard).length;
  const chars = Object.entries(CHARS).map(([k,c])=>`
    <button class="card char ${sim.heard[k]?'heard':''} ${sim.open===k?'sel':''}" onclick="listen('${k}')">
      <div class="av" style="background:${c.cor}">${c.emoji}</div>
      <h4>${c.nome}</h4><small>${c.cargo}</small>
      <p style="margin-top:8px;font-size:.82rem">${sim.heard[k]?'Toque para rever':'Toque para ouvir'}</p>
    </button>`).join('');
  let dlg='';
  if(sim.open){
    const c=CHARS[sim.open];
    dlg=`<div class="dialog">
      <div class="says"><p><b>${c.nome}</b> · ${c.cargo}<br><br>${c.fala}</p></div>
      <div class="under">💡 ${c.fundo}</div></div>`;
  }
  const missing = Object.keys(CHARS).filter(k=>!sim.heard[k]).map(k=>CHARS[k].nome);
  const alts = Object.entries(ALTS).map(([k,a])=>`
    <div class="card alt" onclick="chooseAlt('${k}')">
      <div class="row" style="justify-content:space-between"><div class="letter">${k}</div></div>
      <h3>${a.titulo}</h3><p>${a.resumo}</p>
      <ul>${a.pontos.map(p=>`<li>${p}</li>`).join('')}</ul>
      <button class="btn primary sm" style="margin-top:auto;align-self:flex-start">Escolher esta alternativa</button>
    </div>`).join('');
  return `
  <div class="sim-hero">
    <span class="alert">⚠ Situação crítica</span> <span class="alert" style="background:#7655D9">⭐ Missão especial · +${SIMXP} XP</span>
    <h2>Simulador Profissional: “A obra atrasou”</h2>
    <p>Uma obra está atrasada e diferentes setores precisam chegar a uma solução. Você é o(a) engenheiro(a) coordenador(a) que vai mediar a conversa e tomar a decisão final.</p>
    <div class="facts">
      <div class="fact"><b>4 semanas</b><span>de atraso projetado</span></div>
      <div class="fact"><b>+8%</b><span>acima do orçamento</span></div>
      <div class="fact"><b>Laje 5º andar</b><span>concretagem parada</span></div>
      <div class="fact"><b>Cliente</b><span>pressionando</span></div>
    </div>
  </div>

  <div class="step"><i>1</i><h3>Ouça os envolvidos</h3></div>
  <p style="color:var(--muted);margin-bottom:12px">Cada pessoa tem uma visão e um interesse diferentes. Quanto mais você ouvir, melhor será a sua leitura da situação. (${heardN}/4 ouvidos)</p>
  <div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${chars}</div>
  ${dlg}

  <div class="step"><i>2</i><h3>Escolha uma solução</h3></div>
  ${missing.length?`<div class="hint">👀 Você ainda não ouviu: <b>${missing.join(', ')}</b>. Ouvir todos influencia a sua nota de <b>Escuta ativa</b> e pode revelar alternativas.</div>`:'<div class="hint" style="background:#e9f9f2;border-color:var(--ok);color:#0f5f42">✔ Você ouviu todos os envolvidos. Hora de decidir!</div>'}
  <div class="grid g3" style="margin-top:14px">${alts}</div>`;
}
function listen(k){ sim.heard[k]=true; sim.open = (sim.open===k && false) ? null : k; render(true); }
function chooseAlt(k){
  const a=ALTS[k];
  openModal(`<h3>Confirmar decisão?</h3>
    <p style="color:var(--muted);margin:8px 0 14px">Você escolheu a alternativa <b>${k}</b>: <b>${a.titulo}</b>.</p>
    ${Object.keys(sim.heard).length<4?`<div class="hint" style="margin-bottom:14px">Você ainda não ouviu todos os envolvidos. Isso pode reduzir sua nota de escuta ativa.</div>`:''}
    <div class="row"><button class="btn primary" onclick="confirmAlt('${k}')">Confirmar e ver resultado</button><button class="btn line" onclick="closeModal()">Voltar e pensar mais</button></div>`);
}
function confirmAlt(k){
  sim.choice=k; closeModal();
  const sc = scores(k);
  S.simRuns++;
  if(!S.bestSim || avg(sc)>avg(S.bestSim)) S.bestSim=sc;
  save(); render(); window.scrollTo({top:0});
}
function scores(k){
  const a=ALTS[k], h=Object.keys(sim.heard).length, d=h-2;
  const clamp=n=>Math.max(5,Math.min(100,Math.round(n)));
  return {com:clamp(a.base.com+d*3), esc:clamp(a.base.esc+d*9), col:clamp(a.base.col+d*2), neg:clamp(a.base.neg+d*3)};
}
function simResult(){
  const k=sim.choice, a=ALTS[k], sc=scores(k), h=Object.keys(sim.heard).length, total=avg(sc);
  const metrics = Object.entries(a.m).map(([n,v])=>`
    <div style="margin-bottom:12px"><div class="barlabel"><span>${n}</span><span>${v}/100</span></div><div class="bar ${barc(v)}"><i style="width:${v}%"></i></div></div>`).join('');
  const skillCards = Object.keys(SKILLS).map(s=>{
    const [lbl,cl]=lvl(sc[s]);
    let extra='';
    if(s==='esc'){
      extra = h===4 ? `<p class="pos">Você ouviu os 4 envolvidos antes de decidir, e isso mostra interesse genuíno em compreender cada ponto de vista.</p>`
        : h===0 ? `<p class="imp">Você decidiu sem ouvir ninguém. Na vida real, mesmo 5 minutos de conversa com cada setor mudam a qualidade da decisão.</p>`
        : `<p class="imp">Você ouviu ${h} de 4 envolvidos. Quem ficou de fora poderia ter trazido uma informação importante.</p>`;
    }
    return `<div class="card"><div class="score-card">
        <div class="ring" style="--p:${sc[s]}"><span>${sc[s]}</span></div>
        <div><h3>${SKILL_ICON[s]} ${SKILLS[s]}</h3><span class="lvl ${cl}">${lbl}</span></div></div>
      <div class="fbk"><p class="pos">${a.fb[s][0]}</p><p class="imp">${a.fb[s][1]}</p>${extra}</div></div>`;
  }).join('');
  const [tl,tc]=lvl(total);
  const tip = k==='B' ? 'Você mostrou uma postura colaborativa e transparente: exatamente o que se espera de um(a) profissional que coordena equipes.'
    : k==='A' ? 'Sua decisão resolveu parte do prazo, mas deixou custos e desgaste. Tente na próxima vez envolver os setores antes de decidir.'
    : 'A decisão trouxe riscos de confiança e de relacionamento. Tente novamente: ouvir todos e conversar com transparência abre caminhos melhores.';
  return `
  ${backBtn('Voltar ao início')}
  <div class="sim-hero">
    <span class="alert">Resultado da simulação</span>
    <h2>Alternativa ${k}: ${a.titulo}</h2>
    <p>${tip}</p>
    <div class="row" style="margin-top:14px"><span class="lvl ${tc}" style="font-size:.9rem">Desempenho geral: ${total}/100 · ${tl}</span> <span class="chip o">+${SIMXP} XP · Missão especial</span></div>
  </div>

  <div class="sec"><h3>📊 Consequências da sua decisão</h3></div>
  <div class="card"><p style="color:#34456a;margin-bottom:16px;font-size:.96rem">${a.conseq}</p>${metrics}</div>

  <div class="sec"><h3>🎯 Feedback das competências</h3></div>
  <div class="grid g2">${skillCards}</div>

  <div class="sec"><h3>💬 O que os envolvidos diriam</h3></div>
  <div class="grid g2">${reactions(k)}</div>

  <div class="row" style="margin-top:26px">
    <button class="btn orange" onclick="resetSim()">↻ Tentar outra alternativa</button>
    <button class="btn primary" onclick="go('portfolio')">Ver meu portfólio</button>
    <button class="btn line" onclick="go('mentors')">Falar com um mentor</button>
  </div>`;
}
function reactions(k){
  const R = {
    A:{eng:'“Conseguimos acelerar, mas o novo concreto exige ensaios extras. Eu preferia ter sido consultada antes.”',com:'“O cliente ficou aliviado com o prazo. Só espero que não precisemos repetir isso.”',fin:'“O custo extra de 14% foi pesado. Vamos precisar compensar nos próximos meses.”',for:'“Perdi a obra e fiquei chateado. Eu teria entregado parte do volume.”'},
    B:{eng:'“Reorganizar a sequência manteve a qualidade e a equipe produtiva. Foi a decisão mais segura.”',com:'“Falei com o cliente com um prazo honesto e ele valorizou. Isso preserva o contrato.”',fin:'“O custo extra ficou pequeno e diluído. Consigo defender isso no fechamento do mês.”',for:'“Fui ouvido e consegui planejar a entrega parcial. Quero continuar sendo parceiro de vocês.”'},
    C:{eng:'“A equipe está desmotivada e vamos ter retrabalho. Precisamos de um plano real, não de pressão.”',com:'“Quando o cliente descobriu o atraso, a confiança quebrou. Ficou muito difícil recuperar.”',fin:'“A multa não resolveu nada e ainda perdemos um bom fornecedor.”',for:'“Fui tratado como único culpado. Daqui pra frente, outras obras terão prioridade.”'}}[k];
  return Object.entries(CHARS).map(([ck,c])=>`<div class="card"><div class="row"><div class="av" style="width:42px;height:42px;border-radius:50%;background:${c.cor};display:grid;place-items:center;font-size:1.3rem">${c.emoji}</div><div><b>${c.nome}</b><br><small style="color:var(--muted)">${c.cargo}</small></div></div><p style="margin-top:10px;font-style:italic">${R[ck]}</p></div>`).join('');
}
function resetSim(){ sim={heard:{},open:null,choice:null}; render(); window.scrollTo({top:0}); toast('Simulação reiniciada. Boa sorte!'); }

/* ---------- Pontos, níveis e utilitários de quiz ---------- */
const LEVELS=[[0,'Calouro'],[100,'Explorador'],[250,'Aprendiz de Engenheiro'],[450,'Projetista'],[700,'Engenheiro em Formação'],[1000,'Mestre dos Desafios']];
function level(p){
  let i=0; LEVELS.forEach((l,k)=>{ if(p>=l[0]) i=k; });
  const nx=LEVELS[i+1];
  return {n:i+1,name:LEVELS[i][1],from:LEVELS[i][0],next:nx?nx[0]:null,nextName:nx?nx[1]:null};
}
function points(){
  let p=120; // pontos iniciais demonstrativos
  p+=Object.keys(S.lessons).length*50;
  Object.entries(S.quiz).forEach(([k,v])=>{ const [id,i]=k.split('-'); if(COURSES[id]&&COURSES[id].lesson.ex[i]&&COURSES[id].lesson.ex[i].c===v) p+=10; });
  Object.entries(S.esq).forEach(([k,v])=>{ const [id,i]=k.split('-'); if(ESQ[id]&&ESQ[id].q[i]&&ESQ[id].q[i].c===v) p+=10; });
  Object.entries(S.mq).forEach(([k,v])=>{ const [id,i]=k.split('-'); const m=MIS.find(x=>x.id===id); if(m&&m.q[i]&&m.q[i].c===v) p+=15; });
  p+=Object.keys(S.missions).filter(k=>S.missions[k]).length*30;
  Object.values(S.ch).forEach(a=>{ p+=a.filter(Boolean).length*20; });
  p+=S.simRuns*20;
  return p;
}
function quizHTML(qs,store,pre,fn,pts){
  return qs.map((q,i)=>{
    const a=store[pre+'-'+i];
    const opts=q.o.map((o,j)=>{
      let cls='opt'; if(a!==undefined){ if(j===q.c) cls+=' right'; else if(j===a) cls+=' wrong'; }
      return `<button class="${cls}" ${a!==undefined?'disabled':''} onclick="${fn}('${pre}',${i},${j})">${String.fromCharCode(65+j)}) ${o}</button>`;
    }).join('');
    const fb=a!==undefined?`<div class="fb">${a===q.c?'✔ Correto! +'+pts+' XP. ':'✘ Não foi dessa vez (0 ponto). '}${q.e}</div>`:'';
    return `<div class="q"><p>${i+1}. ${q.q}</p>${opts}${fb}</div>`;
  }).join('');
}

  if(f===0){ let n=0,a=0; Object.keys(ESQ).forEach(i=>{ const s=esqStats(i); n+=s.n; a+=s.a; }); return Math.round(a/n*100); }

/* gráficos em SVG/CSS puro (sem bibliotecas) */
function barChart(vals,labs){
  const w=320,h=170,pad=26,bw=(w-20)/vals.length,max=Math.max(...vals)*1.1;
  let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Gráfico de barras">`;
  vals.forEach((v,i)=>{
    const bh=(h-pad-24)*v/max, x=10+i*bw+bw*.15, y=h-pad-bh;
    s+=`<rect x="${x}" y="${y}" width="${bw*.7}" height="${bh}" rx="5" fill="${i===vals.length-1?'#F28C38':'#7655D9'}"/>
      <text x="${x+bw*.35}" y="${y-5}" font-size="10" text-anchor="middle" fill="#14213d" font-weight="700">${v}%</text>
      <text x="${x+bw*.35}" y="${h-8}" font-size="10" text-anchor="middle" fill="#5b6b8c">${labs[i]}</text>`;
  });
  return s+'</svg>';
}
function lineChart(vals,labs){
  const w=320,h=170,pl=16,pb=24,pt=20,max=Math.max(...vals)*1.15,step=(w-2*pl)/(vals.length-1);
  const pts=vals.map((v,i)=>[pl+i*step,h-pb-(h-pb-pt)*v/max]);
  const poly=pts.map(p=>p.join(',')).join(' ');
  const area=`${pl},${h-pb} ${poly} ${pl+(vals.length-1)*step},${h-pb}`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Gráfico de linha"><polygon points="${area}" fill="rgba(118,85,217,.12)"/>
    <polyline points="${poly}" fill="none" stroke="#7655D9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`+

const TIERS={s:['Simples',10],i:['Intermediária',20],a:['Avançada',35],e:['Especial',50]};

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseK=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
function today(){const d=new Date();d.setDate(d.getDate()+(S.off||0));return keyOf(d);}
function addDays(k,n){const d=parseK(k);d.setDate(d.getDate()+n);return keyOf(d);}
function weekKey(k){const d=parseK(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d);}
function dayIdx(){const [y,m,d]=today().split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5);}
const DIAS=['D','S','T','Q','Q','S','S'];

/* --- sequência --- */
function streakNow(){const t=today(),l=S.st.last;return (l===t||l===addDays(t,-1))?S.st.cur:0;}
function bumpStreak(){const t=today(),st=S.st;if(st.last===t)return false;st.cur=(st.last===addDays(t,-1))?st.cur+1:1;st.best=Math.max(st.best,st.cur);st.last=t;st.days[t]=1;return true;}

const LG=[{n:'Bronze',e:'🥉'},{n:'Prata',e:'🥈'},{n:'Ouro',e:'🥇'},{n:'Diamante',e:'💎'}];
const LGDATA=[
 [['Lucas Ferreira',160],['Camila Rocha',140],['Davi Monteiro',125],['Sofia Lacerda',95],['Enzo Barbosa',70],['Marcela Dias',50],['Pietro Alves',30],['Nina Prado',15]],

function ensureWeek(){const k=weekKey(today());if(S.wk.k!==k){if(S.wk.k)settleWeek(true);S.wk={k,xp:0};save();}}
function settleWeek(auto){

/* --- efeitos visuais --- */
function confetti(){const cols=['#7655D9','#F28C38','#142B45','#ffffff','#a28af0','#ffb066'],b=document.createElement('div');b.className='confetti';
  for(let i=0;i<40;i++){const p=document.createElement('i');p.style.cssText=`left:${Math.random()*100}%;background:${cols[i%6]};animation-delay:${Math.random()*.3}s;animation-duration:${1.1+Math.random()*.9}s`;b.appendChild(p);}
  document.body.appendChild(b);setTimeout(()=>b.remove(),2400);}
function fx(xp,label){const c=document.createElement('div');c.className='xpfly';c.innerHTML=`+${xp} XP<small>${label||''}</small>`;document.body.appendChild(c);setTimeout(()=>c.remove(),1700);confetti();}
function pop(html){const n=document.querySelectorAll('.achpop').length,e=document.createElement('div');e.className='achpop';e.style.top=(14+n*74)+'px';e.innerHTML=html;document.body.appendChild(e);setTimeout(()=>e.remove(),3300);}
function levelUp(n){const L=LEVELS[n-1];openModal(`<div style="text-align:center;padding:8px 0"><div style="font-size:3.4rem">🚀</div><h3 style="padding:0">Você subiu de nível!</h3><div class="big" style="margin:8px 0">Nível ${n} · ${L[1]}</div><p style="color:var(--muted)">Continue completando missões para evoluir ainda mais.</p><button class="btn orange" style="margin-top:14px" onclick="closeModal()">Continuar</button></div>`);confetti();}

/* --- motor de XP --- */
function gain(key,xp,label,o){
  o=o||{}; if(S.xpd[key])return null;
  ensureWeek(); const before=level(S.xp).n;
  S.xpd[key]=1; S.xp+=xp; S.wk.xp+=xp;
  const first=bumpStreak();
  if(o.mission){S.cnt++;if(o.prac)S.prac++;}
  const na=checkAch(); save();
  const after=level(S.xp).n, lu=after>before;
  fx(xp,label);
  if(first)setTimeout(()=>pop(`🔥 <b>Sequência de ${S.st.cur} dia${S.st.cur>1?'s':''}!</b><br>Missão do dia feita. Volte amanhã!`),700);
  na.forEach((a,i)=>setTimeout(()=>pop(`${a.e} <b>Conquista desbloqueada</b><br>${a.n}`),1500+i*1300));
  if(lu&&!o.noModal)setTimeout(()=>levelUp(after),900);
  render(true);
  return {xp,lu,after,first};
}

const stDone=(t,i)=>!!(S.map[t]&&S.map[t][i]);
const trailCount=t=>S.map[t]?Object.keys(S.map[t]).length:0;
const trailDone=id=>{const T=TRAILS.find(x=>x.id===id);return T.st.every((_,i)=>stDone(id,i));};
function stStatus(T,i){if(stDone(T.id,i))return 'done';if(i===0)return (T.req&&trailCount(T.req[0])<T.req[1])?'lock':'open';return stDone(T.id,i-1)?'open':'lock';}
const stTier=(T,i)=>i===T.st.length-1?'e':['s','i','a'][Math.min(i,2)];

VIEWS.map=()=>{
  const tot=TRAILS.reduce((a,T)=>a+T.st.length,0),dn=TRAILS.reduce((a,T)=>a+trailCount(T.id),0),pct=Math.round(dn/tot*100);

    const nodes=T.st.map((s,i)=>{const st=stStatus(T,i),tr=stTier(T,i),lab={done:'Concluída',open:'Disponível',lock:'Bloqueada'}[st];

function openStage(t,i){
  const T=TRAILS.find(x=>x.id===t),st=stStatus(T,i);
  if(st==='lock'){const m=(i===0&&T.req)?`Conclua pelo menos <b>${T.req[1]} etapa(s)</b> da trilha <b>${TRAILS.find(x=>x.id===T.req[0]).n}</b> para liberar.`:'Conclua a <b>etapa anterior</b> desta trilha para liberar.';
    openModal(`<h3>🔒 Etapa bloqueada</h3><p style="color:var(--muted);margin:10px 0 14px">${m}</p><button class="btn primary" onclick="closeModal()">Entendi</button>`);return;}
  showStage(t,i,false);
}
function showStage(t,i,keep){const sc=keep?$('#modal').scrollTop:0;openModal(stageHTML(t,i));$('#modal').scrollTop=sc;}
function stageHTML(t,i){
  const T=TRAILS.find(x=>x.id===t),s=T.st[i],tr=stTier(T,i),xp=TIERS[tr][1],done=stDone(t,i);let ans=0,ok=0;
  const qs=s[2].map((q,k)=>{const a=S.ms[t+'-'+i+'-'+k];if(a!==undefined){ans++;if(a===q.c)ok++;}
    const op=q.o.map((o,j)=>{let c='opt';if(a!==undefined){if(j===q.c)c+=' right';else if(j===a)c+=' wrong';}return `<button class="${c}" ${a!==undefined?'disabled':''} onclick="ansStage('${t}',${i},${k},${j})">${String.fromCharCode(65+j)}) ${o}</button>`;}).join('');
    return `<div class="q"><p>${k+1}. ${q.q}</p>${op}${a!==undefined?`<div class="fb">${a===q.c?'✔ Correto! ':'✘ Quase lá. '}${q.e}</div>`:''}</div>`;}).join('');
  const n=s[2].length,need=Math.ceil(n/2),all=ans===n;let act;
  if(done)act=`<div class="hint" style="background:#e9f9f2;border-color:var(--ok);color:#0f7a54">✔ Etapa concluída. Revise as explicações quando quiser.</div><div class="row" style="margin-top:12px"><button class="btn line" onclick="retryStage('${t}',${i})">↻ Praticar de novo</button><button class="btn primary" onclick="closeModal()">Fechar</button></div>`;
  else if(!all)act=`<p style="font-size:.85rem;color:var(--muted)">Responda as ${n} questões (${ans}/${n}). Acerte pelo menos ${need} para concluir.</p>`;
  else if(ok>=need)act=`<button class="btn orange" onclick="completeStage('${t}',${i})">Concluir etapa · +${xp} XP</button>`;
  else act=`<div class="hint">Você acertou ${ok} de ${n}. Releia as explicações e tente de novo.</div><button class="btn primary" style="margin-top:10px" onclick="retryStage('${t}',${i})">↻ Tentar novamente</button>`;
  return `<span class="chip o">${TIERS[tr][0]} · +${xp} XP</span><h3 style="margin-top:8px">${T.e} ${s[0]}</h3><p style="color:var(--muted);margin:6px 0 14px">${s[1]}</p>${qs}<div style="margin-top:6px">${act}</div>`;
}
function ansStage(t,i,k,j){const key=t+'-'+i+'-'+k;if(S.ms[key]!==undefined)return;S.ms[key]=j;save();showStage(t,i,true);}
function retryStage(t,i){const T=TRAILS.find(x=>x.id===t);T.st[i][2].forEach((_,k)=>delete S.ms[t+'-'+i+'-'+k]);save();showStage(t,i,false);}
function completeStage(t,i){
  if(stDone(t,i))return;
  const T=TRAILS.find(x=>x.id===t),s=T.st[i],tr=stTier(T,i),xp=TIERS[tr][1];
  let ok=0;s[2].forEach((q,k)=>{if(S.ms[t+'-'+i+'-'+k]===q.c)ok++;});
  S.map[t]=S.map[t]||{};S.map[t][i]=1;
  const g=gain('stage:'+t+i,xp,'Etapa concluída',{mission:1,noModal:1}), fin=trailDone(t), nx=i+1<T.st.length;
  openModal(`<div style="text-align:center"><div style="font-size:3.2rem">${fin?'🏆':'🎉'}</div><h3 style="padding:0">${fin?'Trilha concluída!':'Etapa concluída!'}</h3>
    <div class="big" style="margin:8px 0;color:var(--orange)">+${xp} XP</div>
    <p style="color:var(--muted)">Você acertou ${ok} de ${s[2].length} em “${s[0]}”. ${ok===s[2].length?'Desempenho perfeito!':'Releia as explicações para fixar o que faltou.'}</p>
    ${g&&g.lu?`<div class="hint" style="margin-top:12px;background:#f4f1fd;border-color:#7655D9;color:#4a3a8a">🚀 Você subiu para o <b>Nível ${g.after} · ${LEVELS[g.after-1][1]}</b>!</div>`:''}
    <div class="row" style="justify-content:center;margin-top:16px">${nx?`<button class="btn orange" onclick="openStage('${t}',${i+1})">Próxima etapa</button>`:''}<button class="btn ${nx?'line':'orange'}" onclick="closeModal()">Voltar ao mapa</button></div></div>`);
}

   {k:'c',tipo:'Raciocínio e competências',e:'🧠',tr:'i',q:c,ctx:c.ctx}];
}
function ansDaily(k,j){

}

const _rankOld=VIEWS.rank;
VIEWS.rank=()=>{
  const P=S.xp,L=level(P),lp=L.next?Math.round((P-L.from)/(L.next-L.from)*100):100,A=ACH(),n=A.filter(a=>a.ok).length;
  const cards=A.map(a=>`<div class="card ach ${a.ok?'':'lk'}"><div class="md">${a.ok?a.e:'🔒'}</div><h4>${a.n}</h4><p>${a.d}</p>${a.ok?`<span class="chip g">Desbloqueada · ${parseK(S.ach[a.id]||today()).toLocaleDateString('pt-BR')}</span>`:`<div class="bar o"><i style="width:${a.v/a.t*100}%"></i></div><small style="color:var(--muted)">${a.v}/${a.t}</small>`}</div>`).join('');
  const lv=LEVELS.map((l,i)=>`<span class="chip ${P>=l[0]?'g':''}">${i+1}. ${l[1]} · ${l[0]} XP</span>`).join('');
  return `<div class="pagehead"><h2>Conquistas e Evolução</h2><p>Seu XP, nível, sequência e medalhas.</p></div>
  <div class="grid g2"><div class="card"><div class="row" style="gap:18px"><div class="ring" style="--p:${lp}"><span>${L.n}</span></div><div style="flex:1;min-width:170px"><h3>Nível ${L.n} · ${L.name}</h3><div class="big">${P} <span style="font-size:1rem;color:var(--muted)">XP</span></div><p style="font-size:.85rem">${L.next?`Faltam ${L.next-P} XP para ${L.nextName}.`:'Nível máximo alcançado!'}</p></div></div><div class="row" style="gap:6px;margin-top:14px">${lv}</div></div>
  <div class="card"><h3>🔥 Sequência de estudos</h3><div class="row" style="gap:26px;margin:10px 0"><div class="stat"><b>${streakNow()}</b><span>dias seguidos</span></div><div class="stat"><b>${S.st.best}</b><span>melhor sequência</span></div><div class="stat"><b>${S.cnt}</b><span>missões concluídas</span></div></div>
   <div class="hint">Como ganhar XP: Simples +10 · Intermediária +20 · Avançada +35 · Desafio especial +50.</div></div></div>
  <div class="sec"><h3>🏅 Conquistas (${n}/${A.length})</h3></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${cards}</div>
  <div class="card" style="margin-top:16px"><h3>🧪 Ferramentas da demonstração</h3><p>Os dados ficam salvos neste navegador (localStorage), sem cadastro nem banco de dados.</p><div class="row" style="margin-top:12px"><button class="btn line sm" onclick="nextDay()">⏭ Simular próximo dia</button><button class="btn line sm" onclick="settleWeek(false)">📅 Encerrar semana</button><button class="btn orange sm" onclick="resetDemo()">↺ Reiniciar dados demonstrativos</button></div></div>
  <details class="ph" style="margin-top:16px"><summary><div class="num">🏆</div><div style="flex:1"><h3 style="font-size:1.05rem">Medalhas da jornada, certificado e ranking por semestre</h3></div></summary><div class="body">${_rankOld()}</div></details>`;
};

/* --- painel institucional: novos indicadores gamificados --- */
function gameDash(){
  const T=[['1º semestre',212,48,3.4,81],['2º semestre',286,57,4.1,74],['3º semestre',341,64,4.6,70],['4º semestre',395,71,5.2,66]];
  const avgXp=Math.round(T.reduce((a,x)=>a+x[1],0)/4),avgM=Math.round(T.reduce((a,x)=>a+x[2],0)/4),avgF=(T.reduce((a,x)=>a+x[3],0)/4).toFixed(1);
  const drop=STUD.filter(s=>s.t==='↓');
  const kpi=(l,v,s)=>`<div class="card kpi"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;
  const cmp=(lab,i,max,suf)=>T.map(x=>`<div class="gcmp"><span>${x[0]}</span><div class="bar ${x[i]<(max*.55)?'o':''}"><i style="width:${Math.min(100,x[i]/max*100)}%"></i></div><b>${x[i]}${suf}</b></div>`).join('');
  return `<div class="sec"><h3>🎮 Gamificação e engajamento por turma</h3><span class="chip o">Dados demonstrativos</span></div>
  <div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${kpi('Média de XP das turmas',avgXp+' XP','média dos 4 semestres')}${kpi('Missões concluídas',avgM+'%','das missões previstas')}${kpi('Frequência de uso',avgF+'×','acessos por semana por estudante')}${kpi('Queda de engajamento',drop.length,'estudantes em queda nesta semana')}</div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><h3>Comparação entre turmas · XP médio</h3><p style="margin-bottom:12px">XP acumulado por estudante</p>${cmp('xp',1,400,' XP')}</div>
  <div class="card"><h3>Comparação entre turmas · % de missões</h3><p style="margin-bottom:12px">Missões concluídas sobre as previstas</p>${cmp('m',2,100,'%')}</div>
  <div class="card"><h3>Frequência de utilização</h3><p style="margin-bottom:12px">Acessos por semana por estudante</p>${cmp('f',3,6,'×')}</div>
  <div class="card"><h3>📉 Estudantes com queda de engajamento</h3><p style="margin-bottom:10px">Sinais de atenção, sem previsão de evasão.</p>${drop.map(s=>`<div class="rk"><div class="pos">↓</div><div><b>${s.n}</b><br><small style="color:var(--muted)">${s.sem}º sem · ${s.dias} dias sem acesso</small></div><button class="btn ghost sm" style="margin-left:auto" onclick="openStud(${s.id})">Ver</button></div>`).join('')||'<p>Nenhum estudante em queda.</p>'}</div></div>`;
}

/* --- ganchos de XP nas atividades existentes --- */
const _answer=answer;answer=function(id,i,j){const f=S.quiz[id+'-'+i]===undefined;_answer(id,i,j);if(f&&j===COURSES[id].lesson.ex[i].c)gain('lq:'+id+i,10,'Acerto');};
const _fl=finishLesson;finishLesson=function(id){const f=!S.lessons[id];_fl(id);if(f)gain('les:'+id,20,'Aula concluída',{mission:1});};
const _ae=ansEsq;ansEsq=function(id,i,j){const f=S.esq[id+'-'+i]===undefined;_ae(id,i,j);if(f&&j===ESQ[id].q[i].c)gain('esq:'+id+i,10,'Acerto');const s=esqStats(id);if(s.a===s.n)gain('esqd:'+id,20,'Trilha concluída',{mission:1});};
const _am=ansMis;ansMis=function(id,i,j){const f=S.mq[id+'-'+i]===undefined;_am(id,i,j);if(f&&j===MIS.find(m=>m.id===id).q[i].c)gain('mq:'+id+i,20,'Acerto');};
const _fm=finishMis;finishMis=function(id){const f=!S.missions[id];_fm(id);if(f)gain('mis:'+id,35,'Missão concluída',{mission:1,prac:1});};
const _ts=toggleStep;toggleStep=function(id,i){_ts(id,i);const a=S.ch[id];if(a&&a[i])gain('chs:'+id+i,10,'Etapa do desafio');if(a&&a.every(Boolean)){gain('chd:'+id,50,'Desafio concluído',{mission:1,prac:1});setTimeout(()=>pop('🏆 <b>Desafio concluído!</b><br>Seu projeto foi para o portfólio.'),600);}};
const _ca=confirmAlt;confirmAlt=function(k){_ca(k);gain('sim',SIMXP,'Missão especial',{mission:1,prac:1});};
const _render=render;render=function(k){ensureDay();ensureWeek();_render(k);};
function hudHTML(){const P=S.xp,L=level(P),lp=L.next?Math.round((P-L.from)/(L.next-L.from)*100):100;
  return `<div class="hud" onclick="go('rank')" title="Ver conquistas"><div class="hchip fire">🔥 ${streakNow()}</div><div class="hxp"><div class="hl"><b>Nível ${L.n} · ${L.name}</b><span>${P} XP${L.next?' · faltam '+(L.next-P):''}</span></div><div class="hbar"><i style="width:${lp}%"></i></div></div><div class="hchip" onclick="event.stopPropagation();go('league')">${LG[S.lg].e} ${LG[S.lg].n}</div></div>`;}
checkAch();ensureWeek();ensureDay();save();

/* ---------- Início ---------- */
buildNav();
render();
</script>
</body>
